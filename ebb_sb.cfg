[mcu EBBCan]
# this is for can
canbus_uuid: cf0c5c294df3 # Insert the CANbus-UUID of your SB2209 RP2040 from the firmware flashing steps
# this is for USB
#serial: /dev/serial/by-id/usb-Klipper_rp2040_50443404089A5B1C-if00

[input_shaper]
shaper_freq_x: 89.8
shaper_type_x: ei
damping_ratio_x: 0.047

shaper_freq_y: 53.4
shaper_type_y: mzv
damping_ratio_y: 0.062

[temperature_sensor EBB_MCU]
sensor_type: temperature_mcu
sensor_mcu: EBBCan

[adxl345]
cs_pin: EBBCan:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

[resonance_tester]
probe_points: 100, 100, 20
accel_chip: adxl345
accel_per_hz: 100
sweeping_period: 0


#####################################################################
# 	Extruder
#####################################################################

#	E0 on SB2209
[extruder]
step_pin: EBBCan:PD0
dir_pin: !EBBCan: PD1
enable_pin: !EBBCan: PD2
microsteps: 16
rotation_distance: 22.268961022
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB13
#control: pid
min_temp: 0
min_extrude_temp: 10
max_temp: 280 # TODO: probably might want to change
max_extrude_only_distance: 105
max_extrude_cross_section: 5
#pid_kp: 57.369
#pid_ki: 2.533
#pid_kd: 324.854
#sensor_type: MAX31865
#sensor_type: EPCOS 100K B57560G104F
sensor_type: PT1000
sensor_pin: EBBCan:PA3
pullup_resistor: 2200
#spi_bus: spi1
#rtd_nominal_r: 100
#rtd_reference_r: 430
#rtd_num_of_wires: 2

[tmc2209 extruder]
uart_pin: EBBCan:PA15
run_current: 0.65
stealthchop_threshold: 0

#####################################################################
# 	Probe
#####################################################################

[probe]
pin: ^EBBCan:PB3
x_offset: 0
y_offset: 21
#z_offset: 0
lift_speed: 30


[fan]
pin: EBBCan:PA1

[heater_fan hotend_fan]
pin: EBBCan:PA0
heater: extruder
heater_temp: 70.0
tachometer_pin: ^EBBCan:PB6


#####################################################################
# 	LED Control
#####################################################################

[neopixel toolhead_light]
pin: EBBCan:PD3
chain_count: 3
color_order: GRBW

[output_pin caselight]
#Chamber Lighting - HE3 Connector
pin: PA3
pwm:true
shutdown_value: 0
cycle_time: 0.01
